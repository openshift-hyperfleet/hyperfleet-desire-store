{{- include "hyperfleet-desire-store.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyperfleet-desire-store.fullname" . }}
  labels:
    {{- include "hyperfleet-desire-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hyperfleet-desire-store.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hyperfleet-desire-store.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hyperfleet-desire-store.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          ports:
            - name: api
              containerPort: {{ .Values.ports.api }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.observability.healthPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.observability.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "hyperfleet-desire-store.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* Explicit env takes precedence over all envFrom sources. */}}
          env:
            - name: SHUTDOWN_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "hyperfleet-desire-store.fullname" . }}
                  key: SHUTDOWN_TIMEOUT
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.observability.probes.liveness.path }}
              port: health
            initialDelaySeconds: {{ .Values.observability.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.observability.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.observability.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.observability.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.observability.probes.readiness.path }}
              port: health
            initialDelaySeconds: {{ .Values.observability.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.observability.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.observability.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.observability.probes.readiness.failureThreshold }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
