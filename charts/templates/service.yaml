apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyperfleet-desire-store.fullname" . }}
  labels:
    {{- include "hyperfleet-desire-store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.ports.api }}
      targetPort: api
      protocol: TCP
    - name: health
      port: {{ .Values.observability.healthPort }}
      targetPort: health
      protocol: TCP
    - name: metrics
      port: {{ .Values.observability.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "hyperfleet-desire-store.selectorLabels" . | nindent 4 }}
