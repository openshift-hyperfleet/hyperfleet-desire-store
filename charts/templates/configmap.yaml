{{- $dbMaxConcurrency := trim (toString .Values.config.dbMaxConcurrency) -}}
{{- if or (not (regexMatch "^[0-9]+$" $dbMaxConcurrency)) (lt ($dbMaxConcurrency | int) 1) -}}
{{- fail (printf "config.dbMaxConcurrency must be set to an integer of at least 1 (got %q)" $dbMaxConcurrency) -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyperfleet-desire-store.fullname" . }}
  labels:
    {{- include "hyperfleet-desire-store.labels" . | nindent 4 }}
data:
  HYPERFLEET_SERVER_ADDR: {{ printf ":%v" .Values.ports.api | quote }}
  HYPERFLEET_HEALTH_ADDR: {{ printf ":%v" .Values.observability.healthPort | quote }}
  HYPERFLEET_METRICS_ADDR: {{ printf ":%v" .Values.observability.metricsPort | quote }}
  HYPERFLEET_PARTITION_CLAIM: {{ .Values.config.partitionClaim | toString | quote }}
  HYPERFLEET_DB_MAX_CONCURRENCY: {{ $dbMaxConcurrency | quote }}
  HYPERFLEET_SWEEPER_IDENTITY: {{ .Values.config.sweeperIdentity | toString | quote }}
  HYPERFLEET_WRISTBAND_ISSUER: {{ .Values.config.wristband.issuer | toString | quote }}
  HYPERFLEET_WRISTBAND_AUDIENCE: {{ .Values.config.wristband.audience | toString | quote }}
  HYPERFLEET_WRISTBAND_JWKS_URL: {{ .Values.config.wristband.jwksUrl | toString | quote }}
  {{- with .Values.config.wristband.jwksCaFile }}
  HYPERFLEET_WRISTBAND_JWKS_CA_FILE: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.wristband.algorithms }}
  HYPERFLEET_WRISTBAND_ALGORITHMS: {{ . | quote }}
  {{- end }}
  SHUTDOWN_TIMEOUT: {{ printf "%ds" (int64 .Values.config.shutdownTimeoutSeconds) | quote }}
  {{- with .Values.config.log.level }}
  HYPERFLEET_LOG_LEVEL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.log.format }}
  HYPERFLEET_LOG_FORMAT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.log.output }}
  HYPERFLEET_LOG_OUTPUT: {{ . | quote }}
  {{- end }}
