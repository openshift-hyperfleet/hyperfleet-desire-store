# oapi-codegen configuration
# See: https://github.com/oapi-codegen/oapi-codegen

package: openapi
output: pkg/api/openapi/openapi.gen.go
generate:
  models: true
  chi-server: false
  client: true
  embedded-spec: true
output-options:
  skip-prune: false
  # Optional fields are plain values with omitempty; the handlers read member
  # presence from the body where absent and zero must differ.
  prefer-skip-optional-pointer: true
  # Paths resolve from the repository root, where make generate runs.
  overlay:
    path: openapi/overlay.yaml
